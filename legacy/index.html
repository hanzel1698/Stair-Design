<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCC Stair Designer</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1d2330;--muted:#535b69;--line:#d6dae1;--accent:#2563eb;
--flight:#cddcfb;--flightS:#3b6fd8;--landing:#d8eed5;--landingS:#4c9a52;--beam:#9b7b63;--beamS:#5c4332;
--span:#d9481c;--gridMin:#e6e9ee;--gridMaj:#c9ced8;--canvas:#fbfcfd;--ok:#15803d;--ng:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--panel:#1d2128;--ink:#e6e9ef;--muted:#98a1b0;--line:#323844;--accent:#6c9cff;
--flight:#24365c;--flightS:#7aa2f7;--landing:#23402a;--landingS:#7cc685;--beam:#6b5443;--beamS:#c9a88e;--span:#ff7a4d;--gridMin:#20252d;--gridMaj:#2e3540;--canvas:#171a20;--ok:#4ade80;--ng:#f87171}}
:root[data-theme="dark"]{--bg:#15181d;--panel:#1d2128;--ink:#e6e9ef;--muted:#98a1b0;--line:#323844;--accent:#6c9cff;
--flight:#24365c;--flightS:#7aa2f7;--landing:#23402a;--landingS:#7cc685;--beam:#6b5443;--beamS:#c9a88e;--span:#ff7a4d;--gridMin:#20252d;--gridMaj:#2e3540;--canvas:#171a20;--ok:#4ade80;--ng:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 12px 0 0;font-weight:650}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select,input{background:var(--canvas);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
#app{display:grid;grid-template-columns:64px 1fr 320px;height:calc(100% - 46px)}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px}
#tools button{padding:6px 2px;font-size:11px;line-height:1.2}
#tools hr{border:0;border-top:1px solid var(--line);width:100%}
main{display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.view{flex:1;position:relative;display:none;min-height:0}
.view.show{display:block}
canvas{display:block;width:100%;height:100%;background:var(--canvas)}
#view3d>div.msg{padding:20px;color:var(--muted)}
#lbl3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#lbl3d div{position:absolute;transform:translate(-50%,-100%);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:11px;line-height:1.35;white-space:nowrap;color:var(--ink)}
#lbl3d .dl{color:var(--span);font-weight:600}#lbl3d .ll{color:var(--accent);font-weight:600}
.hud{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--muted);background:var(--panel);padding:2px 6px;border-radius:4px;border:1px solid var(--line);pointer-events:none}
.bar{z-index:2;position:absolute;bottom:8px;right:8px;display:flex;gap:6px;align-items:center;background:var(--panel);padding:4px 6px;border:1px solid var(--line);border-radius:6px}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:0 10px 20px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.form{display:grid;grid-template-columns:1fr 92px;gap:4px 6px;align-items:center}
.form label{font-size:12px}
.form input,.form select{width:100%}
.info{font-size:12px;color:var(--muted);margin-top:6px}
#list div{padding:3px 6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between}
#list div:hover{background:var(--bg)}
#list div.sel{background:var(--accent);color:#fff}
.report{overflow:auto;padding:16px 22px;background:var(--canvas)}
.report h2{font-size:17px;margin:18px 0 8px}
.report h4{margin:14px 0 6px}
.report table{border-collapse:collapse;margin:6px 0 10px;font-size:12px}
.report th,.report td{border:1px solid var(--line);padding:3px 8px;text-align:right}
.report th{background:var(--bg)}
.report td:first-child,.report th:first-child{text-align:left}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--panel)}
.ok{color:var(--ok);font-weight:600}.ng{color:var(--ng);font-weight:600}
.warn{color:var(--ng)}
.calc{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;margin:4px 0}
@media (max-width:900px){#app{grid-template-columns:52px 1fr}aside{grid-column:1/-1;max-height:45vh}}
@media print{header,#tools,aside,.tabs{display:none!important}#app{display:block;height:auto}.view{display:none!important}#viewRes{display:block!important;overflow:visible}body,#viewRes,.card,.report th{background:#fff!important;color:#000!important}}
</style>
<script>try{const t=localStorage.getItem('stairTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header>
  <h1>RCC Stair Designer <span style="font-weight:400;color:var(--muted)">IS 456</span></h1>
  <select id="tplSel">
    <option value="">Template…</option>
    <option value="straight">Straight flight</option>
    <option value="L">L / quarter-turn</option>
    <option value="dog">Dog-legged</option>
    <option value="open">Open-well (C / U type)</option>
  </select>
  <button id="bNew">New</button>
  <button id="bOpen">Open…</button><input type="file" id="fOpen" accept=".json" hidden>
  <button id="bSave">Save</button>
  <button id="bCsv">ETABS loads CSV</button>
  <button id="bPrint">Print report</button>
  <button id="bUndo" title="Ctrl+Z">Undo</button>
  <select id="themeSel" title="Theme" style="margin-left:auto"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
</header>
<div id="app">
  <nav id="tools">
    <button data-tool="select" class="on" title="Select / move (V)">Select</button>
    <button data-tool="pan" title="Pan (right-drag also pans)">Pan</button>
    <hr>
    <button data-tool="grid" title="1. Drag a vertical or horizontal line; set c/c in the panel">1 Grid</button>
    <button data-tool="column" title="2. Click a grid intersection, or drag a box to fill all intersections">2 Column</button>
    <button data-tool="beam" title="3. Drag column to column; set type (primary / secondary / landing / side) in the panel">3 Beam</button>
    <button data-tool="flight" title="4. Drag along the going, in the UP direction">4 Flight</button>
    <button data-tool="landing" title="Drag a rectangle">Landing</button>
    <button data-tool="span" title="Drag from support to support">Span</button>
    <hr>
    <button id="bAuto" title="Create one span per flight, through adjacent landings to beams">Auto spans</button>
    <button id="bDel" title="Delete selected (Del)">Delete</button>
    <button id="bFit" title="Fit view">Fit</button>
  </nav>
  <main>
    <div class="tabs">
      <button data-tab="Plan" class="on">Plan</button>
      <button data-tab="Elev">Elevation</button>
      <button data-tab="3d">3D</button>
      <button data-tab="Res">Results</button>
    </div>
    <div id="viewPlan" class="view show"><canvas id="cPlan"></canvas><div class="hud" id="hud"></div></div>
    <div id="viewElev" class="view"><canvas id="cElev"></canvas>
      <div class="bar">View <select id="elevDir"><option value="x">Front (X–Z, looking +Y)</option><option value="y">Side (Y–Z, looking +X)</option></select></div></div>
    <div id="view3d" class="view"><div id="lbl3d"></div><div class="bar"><label><input type="checkbox" id="wf" checked> Wireframe</label><label><input type="checkbox" id="showLoads" checked> ETABS loads</label><span style="color:var(--span)">■ Stair Dead</span><span style="color:var(--accent)">■ Stair Live</span></div></div>
    <div id="viewRes" class="view report"></div>
  </main>
  <aside>
    <h2>Selected</h2><div id="props"><div class="info">Nothing selected.</div></div>
    <h2>Elements</h2><div id="list"></div>
    <h2>Design parameters</h2><div id="params" class="form"></div>
  </aside>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const P0={fck:25,fy:500,cover:20,bar:12,dbar:8,ff:1.5,ll:4,gc:25,gf:1.5,T:300,R:150,width:1.2,t:200,tl:200,snap:0.05};
let S={p:{...P0},items:[],nid:1};
let sel=null,msel=new Set(),tool='select',tab='Plan',drag=null;
// multi-selection (box / shift-click) is msel; it only counts while it contains sel, so any code that sets sel to something else drops it
const selSet=()=>msel.has(sel)?msel:new Set(sel?[sel]:[]),isSel=id=>selSet().has(id);
const hist=[];

// ---------- model helpers ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r4=v=>Math.round(v*1e4)/1e4;
const snap=v=>r4(Math.round(v/S.p.snap)*S.p.snap);
// structural grids are items {type:'grid', axis:'x'|'y', v, name}; axis x = vertical line at X = v
const grids=axis=>S.items.filter(i=>i.type==='grid'&&i.axis===axis).map(i=>({n:i.name,v:i.v,id:i.id})).sort((a,b)=>a.v-b.v);
function nextGridName(axis){const N=grids(axis).map(g=>g.n);
  if(axis==='x')return String(Math.max(0,...N.map(n=>parseInt(n)||0))+1);
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ';return L[(Math.max(-1,...N.map(n=>L.indexOf(n)))+1)%L.length]; // I and O skipped, as on drawings
}
// older files stored grids as text "1:0, 2:3.6"
function migrateGrids(o){for(const a of['x','y'])if(o['g'+a]){
  String(o['g'+a]).split(/[,;]+/).map(t=>t.trim()).filter(Boolean).forEach((t,i)=>{const m=t.split(/[:=@]/),v=+(m.length>1?m[1]:m[0]);
    if(Number.isFinite(v))o.items.push({type:'grid',axis:a,v,name:m.length>1?m[0].trim():(a==='x'?String(i+1):'ABCDEFGH'[i]||'Z'),id:o.nid++});});delete o['g'+a];}
  return o;}
// grid snap within 8 px, else normal snap step
const gsnap=(v,axis)=>{const g=grids(axis).find(g=>Math.abs(g.v-v)*vp.s<8);return g?g.v:snap(v);};
const gsnapP=w=>[gsnap(w[0],'x'),gsnap(w[1],'y')];
// "on grid 2 (A–B)" style location for a beam
function gridRef(b){const on=(ax,v)=>grids(ax).find(g=>Math.abs(g.v-v)<0.01),
  btw=(ax,a,c)=>{const G=grids(ax);if(!G.length)return'';
    const lab=v=>{const g=G.reduce((p,g)=>Math.abs(g.v-v)<Math.abs(p.v-v)?g:p),o=v-g.v;return Math.abs(o)<0.01?g.n:`${g.n}${o>0?'+':'−'}${Math.abs(o).toFixed(2)}`;};
    return `${lab(Math.min(a,c))} – ${lab(Math.max(a,c))}`;};
  if(Math.abs(b.x1-b.x2)<1e-6){const g=on('x',b.x1);return g?`grid ${g.n} (${btw('y',b.y1,b.y2)})`:'';}
  if(Math.abs(b.y1-b.y2)<1e-6){const g=on('y',b.y1);return g?`grid ${g.n} (${btw('x',b.x1,b.x2)})`:'';}
  return '';}
const byId=id=>S.items.find(i=>i.id===id);
const ofType=t=>S.items.filter(i=>i.type===t);
const PFX={flight:'F',landing:'L',beam:'B',span:'S',column:'C'};
// columns at every grid intersection inside the box that has none yet
function colsAt(x0,y0,x1,y1){const out=[];
  for(const gx of grids('x'))for(const gy of grids('y'))
    if(gx.v>=x0-1e-6&&gx.v<=x1+1e-6&&gy.v>=y0-1e-6&&gy.v<=y1+1e-6&&!ofType('column').some(c=>Math.abs(c.x-gx.v)<1e-6&&Math.abs(c.y-gy.v)<1e-6))
      out.push(add({type:'column',x:gx.v,y:gy.v,b:300,D:300}));
  return out;}
// beam top profile [[s,z],...] along its length; a side beam follows the adjacent flight (flat – inclined – flat)
function sideFlight(b){const L=Math.hypot(b.x2-b.x1,b.y2-b.y1)||1,u=[(b.x2-b.x1)/L,(b.y2-b.y1)/L];
  for(const f of ofType('flight')){const F=frame(f);if(Math.abs(F.u[0]*u[0]+F.u[1]*u[1])<0.99)continue;
    const cx=(F.r.x0+F.r.x1)/2,cy=(F.r.y0+F.r.y1)/2,off=Math.abs((cx-b.x1)*u[1]-(cy-b.y1)*u[0]);
    if(off-F.w/2>b.b/2000+0.3)continue;
    const pr=(x,y)=>(x-b.x1)*u[0]+(y-b.y1)*u[1],sa=pr(...F.O),sb=pr(F.O[0]+F.u[0]*F.L,F.O[1]+F.u[1]*F.L);
    if(Math.max(sa,sb)<0||Math.min(sa,sb)>L)continue;
    return[[sa,f.z0],[sb,r4(f.z0+F.H)]].sort((p,q)=>p[0]-q[0]);}
  return null;}
const interp=(pts,s)=>{if(s<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++)if(s<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];return a[1]+(b[1]-a[1])*(s-a[0])/((b[0]-a[0])||1);}return pts[pts.length-1][1];};
function beamTop(b){const L=Math.hypot(b.x2-b.x1,b.y2-b.y1),raw=b.kind==='side'&&sideFlight(b);
  if(!raw)return[[0,b.z],[L,b.z]];
  return[[0,interp(raw,0)],...raw.filter(p=>p[0]>0&&p[0]<L),[L,interp(raw,L)]];}
const beamZ=(b,s)=>interp(beamTop(b),s);
const zTxt=b=>{const t=beamTop(b);return t.length>2?`${f2(t[0][1],3)} → ${f2(t[t.length-1][1],3)}`:f2(b.z,3);};
function add(o){
  o.id=S.nid++;
  if(!o.name){const k=ofType(o.type).map(i=>+String(i.name).slice(1)||0);o.name=PFX[o.type]+(Math.max(0,...k)+1);}
  S.items.push(o);return o;
}
function commit(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift();}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());sel=null;refresh(true);}

// flight local frame: rect = O + s*u + q*v, s in [0,L] (going, uphill), q in [0,w]
function frame(f){
  const L=(f.n-1)*f.T/1000,w=f.width,ax=f.dir[1]==='x',neg=f.dir[0]==='-';
  const r=ax?{x0:f.x,y0:f.y,x1:f.x+L,y1:f.y+w}:{x0:f.x,y0:f.y,x1:f.x+w,y1:f.y+L};
  return{L,w,r,u:ax?[neg?-1:1,0]:[0,neg?-1:1],v:ax?[0,1]:[1,0],
    O:ax?[neg?r.x1:r.x0,r.y0]:[r.x0,neg?r.y1:r.y0],H:f.n*f.R/1000};
}
const rectOf=it=>it.type==='flight'?frame(it).r:it.type==='column'?{x0:it.x-it.b/2000,y0:it.y-it.D/2000,x1:it.x+it.b/2000,y1:it.y+it.D/2000}:{x0:it.x,y0:it.y,x1:it.x+it.w,y1:it.y+it.h};
function flightLevel(f,x,y){const F=frame(f);const s=(x-F.O[0])*F.u[0]+(y-F.O[1])*F.u[1];return f.z0+clamp(s/F.L,0,1)*F.H;}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;const t=l2?clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
// Liang-Barsky clip of segment a->b against rect; returns [t0,t1] or null
function clip(ax,ay,bx,by,r){
  let t0=0,t1=1;const dx=bx-ax,dy=by-ay;
  for(const[p,q]of[[-dx,ax-r.x0],[dx,r.x1-ax],[-dy,ay-r.y0],[dy,r.y1-ay]]){
    if(Math.abs(p)<1e-12){if(q<-1e-9)return null;continue;}
    const t=q/p;if(p<0){if(t>t1)return null;if(t>t0)t0=t;}else{if(t<t0)return null;if(t<t1)t1=t;}
  }
  return t1-t0>1e-6?[t0,t1]:null;
}
function levelGuess(x,y,tol){
  for(const l of ofType('landing')){const r=rectOf(l);if(x>=r.x0-tol&&x<=r.x1+tol&&y>=r.y0-tol&&y<=r.y1+tol)return l.z;}
  for(const f of ofType('flight')){const F=frame(f);
    for(const[s,z]of[[F.L,f.z0+F.H],[0,f.z0]]){const ex=F.O[0]+F.u[0]*s,ey=F.O[1]+F.u[1]*s;
      if(distSeg(x,y,ex,ey,ex+F.v[0]*F.w,ey+F.v[1]*F.w)<=tol)return r4(z);}}
  return null;
}

// ---------- loads & analysis ----------
// kN/m2 on plan area
function slabLoads(it){
  const p=S.p;
  if(it.type==='flight'){const sec=Math.hypot(it.R,it.T)/it.T,ws=p.gc*it.t/1000*sec,st=p.gc*it.R/2000;return{ws,st,ff:p.ff,dl:ws+st+p.ff,ll:p.ll};}
  const ws=p.gc*it.t/1000;return{ws,st:0,ff:p.ff,dl:ws+p.ff,ll:p.ll};
}
const spanU=sp=>{const L=Math.hypot(sp.x2-sp.x1,sp.y2-sp.y1);return[(sp.x2-sp.x1)/L,(sp.y2-sp.y1)/L];};
const crosses=(sp,it)=>clip(sp.x1,sp.y1,sp.x2,sp.y2,rectOf(it));
// simply supported, piecewise UDL segs {a,b,w}
function ssBeam(segs,L){
  let W=0,Mo=0;for(const s of segs){const F=s.w*(s.b-s.a);W+=F;Mo+=F*(s.a+s.b)/2;}
  const RB=Mo/L,RA=W-RB;let M=0,xm=0;
  for(let i=0;i<=500;i++){const x=L*i/500;let m=RA*x;
    for(const s of segs){const e=Math.min(x,s.b);if(e>s.a)m-=s.w*(e-s.a)*(x-(s.a+e)/2);}
    if(m>M){M=m;xm=x;}}
  return{RA,RB,W,M,x:xm};
}
function findSupport(sp,end,segs,L,u){
  const P=end?[sp.x2,sp.y2]:[sp.x1,sp.y1];let zs=null;
  if(segs.length){const g=end?segs.reduce((a,b)=>b.b>a.b?b:a):segs[0];const d=end?g.b:g.a;
    zs=g.it.type==='landing'?g.it.z:flightLevel(g.it,sp.x1+u[0]*d,sp.y1+u[1]*d);}
  let best=null,bs=1e9,s=0,bl=0;
  for(const b of ofType('beam')){
    const dd=distSeg(P[0],P[1],b.x1,b.y1,b.x2,b.y2);if(dd>b.b/2000+0.1)continue;
    const l=Math.hypot(b.x2-b.x1,b.y2-b.y1),q=((P[0]-b.x1)*(b.x2-b.x1)+(P[1]-b.y1)*(b.y2-b.y1))/l;
    const sc=(zs==null?0:Math.abs(beamZ(b,q)-zs))*10+dd;if(sc<bs){bs=sc;best=b;s=q;bl=l;}
  }
  if(!best)return{beam:null,zs};
  return{beam:best,zs,s,bl,bz:beamZ(best,s),mismatch:zs!=null&&Math.abs(beamZ(best,s)-zs)>0.3};
}
function analyze(sp){
  const L=Math.hypot(sp.x2-sp.x1,sp.y2-sp.y1);if(L<0.1)return null;
  const u=spanU(sp),segs=[];
  for(const it of S.items){
    if(it.type!=='flight'&&it.type!=='landing')continue;
    const c=crosses(sp,it);if(!c)continue;
    // IS 456 cl 33.2: area common to two spans at right angles carries half load in each direction
    let k=1;
    if(it.type==='landing'&&ofType('span').some(o=>{if(o===sp)return false;const v=spanU(o);return Math.abs(u[0]*v[0]+u[1]*v[1])<0.5&&crosses(o,it);}))k=0.5;
    const ld=slabLoads(it);segs.push({it,a:c[0]*L,b:c[1]*L,k,ld,dl:ld.dl*k,ll:ld.ll*k});
  }
  segs.sort((a,b)=>a.a-b.a);
  const run=f=>ssBeam(segs.map(s=>({a:s.a,b:s.b,w:f(s)})),L);
  const D=run(s=>s.dl),LL=run(s=>s.ll),U=run(s=>S.p.gf*(s.dl+s.ll));
  const fl=segs.filter(s=>s.it.type==='flight');
  const t=fl.length?Math.min(...fl.map(s=>s.it.t)):segs.length?Math.min(...segs.map(s=>s.it.t)):150;
  return{L,u,segs,D,LL,U,t,sup:[0,1].map(e=>findSupport(sp,e,segs,L,u)),des:design(U,t,L)};
}

// ---------- IS 456 design ----------
const TC_PT=[0.15,0.25,0.5,0.75,1,1.25,1.5,1.75,2,2.25,2.5,2.75,3];
const TC={15:[.28,.35,.46,.54,.60,.64,.68,.71,.71,.71,.71,.71,.71],20:[.28,.36,.48,.56,.62,.67,.72,.75,.79,.81,.82,.82,.82],
25:[.29,.36,.49,.57,.64,.70,.74,.78,.82,.85,.88,.90,.92],30:[.29,.37,.50,.59,.66,.71,.76,.80,.84,.88,.91,.94,.96],
35:[.29,.37,.50,.59,.67,.73,.78,.82,.86,.90,.93,.96,.99],40:[.30,.38,.51,.60,.68,.74,.79,.84,.88,.92,.95,.98,1.01]};
const TCMAX={15:2.5,20:2.8,25:3.1,30:3.5,35:3.7,40:4.0};

  const Amin=(p.fy>250?0.0012:0.0015)*b*D,Areq=Math.max(Ast,Amin);
  const ab=Math.PI*p.bar**2/4,sMax=Math.min(3*d,300);

  const abd=Math.PI*p.dbar**2/4,sdMax=Math.min(5*d,450),sd=Math.floor(Math.min(1000*abd/Amin,sdMax)/10)*10,Adprov=1000*abd/sd;
  const pt=100*Aprov/(b*d),tc=tauC(pt,p.fck),k=kSlab(D),tv=Vu/(b*d),tcmax=TCMAX[grade(p.fck)];

// ---------- beam loads (unfactored, for ETABS load patterns) ----------
function beamLoads(){
  const out=new Map(ofType('beam').map(b=>[b,[]])),warn=[];
  for(const sp of ofType('span')){const A=analyze(sp);if(!A)continue;
    A.sup.forEach((s,e)=>{const R=e?'RB':'RA';
      if(!s.beam){warn.push(`${sp.name}: ${e?'end':'start'} has no beam — reaction ${A.D[R].toFixed(2)} (DL) + ${A.LL[R].toFixed(2)} (LL) kN/m not assigned to any beam (wall?)`);return;}
      if(s.mismatch)warn.push(`${sp.name}: ${e?'end':'start'} slab level ${s.zs.toFixed(3)} vs beam ${s.beam.name} level ${s.bz.toFixed(3)} — check`);
      const a=clamp(s.s-sp.width/2,0,s.bl),b=clamp(s.s+sp.width/2,0,s.bl);
      out.get(s.beam).push({sp,a,b,dl:A.D[R],ll:A.LL[R],fu:A.U[R]});});
  }
  for(const f of ofType('flight'))if(!ofType('span').some(sp=>crosses(sp,f)))warn.push(`${f.name}: not covered by any span — its load is not reaching any beam`);
  return{out,warn};
}

function template(kind){

    Ld=o=>add({type:'landing',t:p.tl,...o}),B=o=>add({type:'beam',b:230,D:450,...o}),Lg=n=>r4((n-1)*T);
  if(kind==='straight'){const n=20,L=Lg(n);F({x:0,y:0,dir:'+x',n,z0:0});B({x1:0,y1:0,x2:0,y2:w,z:0});B({x1:L,y1:0,x2:L,y2:w,z:r4(n*R)});}

    F({x:0,y:0,dir:'+x',n,z0:0});Ld({x:L,y:0,w:ld,h:W,z:r4(n*R)});F({x:0,y:r4(w+g),dir:'-x',n,z0:r4(n*R)});

    F({x:0,y:0,dir:'+x',n,z0:0});Ld({x:L,y:0,w,h:w,z:r4(n*R)});F({x:L,y:w,dir:'+y',n,z0:r4(n*R)});
    B({x1:0,y1:0,x2:0,y2:w,z:0});B({x1:r4(L+w),y1:0,x2:r4(L+w),y2:w,z:r4(n*R)});B({x1:L,y1:0,x2:r4(L+w),y2:0,z:r4(n*R)});
    B({x1:L,y1:r4(w+L),x2:r4(L+w),y2:r4(w+L),z:r4(2*n*R)});}
  if(kind==='open'){const n1=8,n2=4,L1=Lg(n1),L2=Lg(n2),z1=r4(n1*R),z2=r4((n1+n2)*R),Y=r4(2*w+L2),X=r4(L1+w);
    F({x:0,y:0,dir:'+x',n:n1,z0:0});Ld({x:L1,y:0,w,h:w,z:z1});F({x:L1,y:w,dir:'+y',n:n2,z0:z1});
    Ld({x:L1,y:r4(w+L2),w,h:w,z:z2});F({x:0,y:r4(w+L2),dir:'-x',n:n1,z0:z2});
    B({x1:0,y1:0,x2:0,y2:w,z:0});B({x1:0,y1:r4(w+L2),x2:0,y2:Y,z:r4((2*n1+n2)*R)});
    B({x1:X,y1:0,x2:X,y2:w,z:z1});B({x1:X,y1:r4(w+L2),x2:X,y2:Y,z:z2});
    B({x1:L1,y1:0,x2:X,y2:0,z:z1});B({x1:L1,y1:Y,x2:X,y2:Y,z:z2});}

  {const bx=ofType('beam').flatMap(b=>[b.x1,b.x2]),by=S.items.flatMap(i=>i.type==='beam'?[i.y1,i.y2]:i.type==='flight'||i.type==='landing'?[rectOf(i).y0,rectOf(i).y1]:[]);
    const G=(axis,v,name)=>add({type:'grid',axis,v:r4(v),name});G('x',Math.min(...bx),'1');G('x',Math.max(...bx),'2');G('y',Math.min(...by),'A');G('y',Math.max(...by),'B');

// one span per flight: through contiguous landings, ends on the beam whose level matches
function autoSpans(noCommit){
  if(!noCommit)commit();
  S.items=S.items.filter(i=>!(i.type==='span'&&i.auto));
  const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
  for(const f of ofType('flight')){
    const F=frame(f),u=F.u,c=[F.O[0]+u[0]*F.L/2+F.v[0]*F.w/2,F.O[1]+u[1]*F.L/2+F.v[1]*F.w/2],pt=t=>[c[0]+u[0]*t,c[1]+u[1]*t];
    const end=sg=>{let t=sg*F.L/2,z=sg>0?f.z0+F.H:f.z0;
      for(let k=0;k<6;k++){const q=pt(t+sg*0.02);
        const l=ofType('landing').find(l=>{const r=rectOf(l);return q[0]>r.x0&&q[0]<r.x1&&q[1]>r.y0&&q[1]<r.y1;});
        if(!l)break;const r=rectOf(l),far=pt(t+sg*100),cc=clip(q[0],q[1],far[0],far[1],r);
        t=t+sg*(0.02+cc[1]*100);z=l.z;}
      let best=null,bs=1e9;
      for(const b of ofType('beam')){const d=[b.x2-b.x1,b.y2-b.y1],den=cross(u,d);if(Math.abs(den)<1e-9)continue;
        const ac=[b.x1-c[0],b.y1-c[1]],tb=cross(ac,d)/den,s=cross(ac,u)/den,tol=b.b/2000/Math.hypot(...d);
        if(s<-tol||s>1+tol||sg*(tb-sg*F.L/2)<-0.3||sg*(tb-t)>0.4)continue;
        const sc=Math.abs(beamZ(b,clamp(s,0,1)*Math.hypot(...d))-z)*10+Math.abs(tb-t);if(sc<bs){bs=sc;best=tb;}}
      return best??t;};
    const a=pt(end(-1)),b=pt(end(1));
    add({type:'span',auto:true,x1:r4(a[0]),y1:r4(a[1]),x2:r4(b[0]),y2:r4(b[1]),width:F.w});
  }
}

// ---------- results ----------
const f2=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):'—',okS=b=>b?'<span class="ok">OK</span>':'<span class="ng">NOT OK</span>';
function results(){
  const p=S.p,{out,warn}=beamLoads();let h=`<h2>Stair loads on beams — for ETABS</h2>
<div class="info">Unfactored line loads (kN/m) to assign as <b>uniform distributed frame loads</b> on each beam, in two load patterns: <b>Stair Dead</b> (self weight of waist/landing + steps + finishes) and <b>Stair Live</b>. Distances are measured from the beam's start point (X1,Y1). The stair itself is not modelled.</div>
<table><tr><th>Beam</th><th>Grid</th><th>Top level (m)</th><th>Length (m)</th><th>From span</th><th>Start dist (m)</th><th>End dist (m)</th><th>Stair Dead (kN/m)</th><th>Stair Live (kN/m)</th><th>Factored (kN/m)</th></tr>`;
  for(const[b,rows]of out){const L=Math.hypot(b.x2-b.x1,b.y2-b.y1);
    if(!rows.length){h+=`<tr><td>${b.name}</td><td>${gridRef(b)}</td><td>${zTxt(b)}</td><td>${f2(L)}</td><td colspan="6" style="text-align:left;color:var(--muted)">no stair load</td></tr>`;continue;}
    rows.forEach((r,i)=>h+=`<tr><td>${i?'':b.name}</td><td>${i?'':gridRef(b)}</td><td>${i?'':zTxt(b)}</td><td>${i?'':f2(L)}</td><td>${r.sp.name}</td><td>${f2(r.a)}</td><td>${f2(r.b)}</td><td>${f2(r.dl)}</td><td>${f2(r.ll)}</td><td>${f2(r.fu)}</td></tr>`);
    const eq=k=>rows.reduce((s,r)=>s+r[k]*(r.b-r.a),0)/L;
    h+=`<tr><td></td><td colspan="4" style="text-align:left;color:var(--muted)">equivalent UDL over full length</td><td>0.00</td><td>${f2(L)}</td><td>${f2(eq('dl'))}</td><td>${f2(eq('ll'))}</td><td>${f2(eq('fu'))}</td></tr>`;}
  h+='</table>';
  if(warn.length)h+='<div class="card warn"><b>Warnings</b><ul>'+warn.map(w=>`<li>${w}</li>`).join('')+'</ul></div>';
  h+=`<h2>Slab design — IS 456:2000</h2><div class="info">M${p.fck} / Fe${p.fy}, clear cover ${p.cover} mm, main bar Ø${p.bar}, distribution Ø${p.dbar}, finishes ${p.ff} kN/m², live ${p.ll} kN/m², γc ${p.gc} kN/m³, γf ${p.gf}. Each span is designed as a 1 m wide simply supported strip; effective span = c/c of supports measured horizontally (cl 33.1); depth = waist thickness normal to soffit (cl 33.3).</div>`;
  for(const sp of ofType('span')){const A=analyze(sp);if(!A){h+=`<div class="card">${sp.name}: too short.</div>`;continue;}const d=A.des;
    h+=`<div class="card"><h4>${sp.name} — effective span ${f2(A.L,3)} m, strip width ${f2(sp.width)} m</h4>
<div class="info">Supports: ${A.sup.map(s=>s.beam?s.beam.name:'none (wall/other)').join(' → ')}</div>
<table><tr><th>Element</th><th>From (m)</th><th>To (m)</th><th>Length (m)</th><th>Slab SW</th><th>Steps</th><th>Finish</th><th>Share</th><th>DL (kN/m²)</th><th>LL (kN/m²)</th><th>wu (kN/m²)</th></tr>`;
    for(const s of A.segs)h+=`<tr><td>${s.it.name} (${s.it.type}, t=${s.it.t})</td><td>${f2(s.a)}</td><td>${f2(s.b)}</td><td>${f2(s.b-s.a)}</td><td>${f2(s.ld.ws)}</td><td>${f2(s.ld.st)}</td><td>${f2(s.ld.ff)}</td><td>${s.k===1?'100%':'50% (cl 33.2)'}</td><td>${f2(s.dl)}</td><td>${f2(s.ll)}</td><td>${f2(p.gf*(s.dl+s.ll))}</td></tr>`;
    h+=`</table><table><tr><th>Per m width</th><th>Dead</th><th>Live</th><th>Factored</th></tr>
<tr><td>Reaction at start (kN/m)</td><td>${f2(A.D.RA)}</td><td>${f2(A.LL.RA)}</td><td>${f2(A.U.RA)}</td></tr>
<tr><td>Reaction at end (kN/m)</td><td>${f2(A.D.RB)}</td><td>${f2(A.LL.RB)}</td><td>${f2(A.U.RB)}</td></tr>
<tr><td>Max moment (kNm/m)</td><td>${f2(A.D.M)}</td><td>${f2(A.LL.M)}</td><td>${f2(A.U.M)} at x = ${f2(A.U.x)} m</td></tr></table>
<div class="calc">D = ${d.D} mm,  d = D − cover − Ø/2 = ${d.D} − ${p.cover} − ${p.bar/2} = ${f2(d.d,1)} mm
Mu = ${f2(d.Mu)} kNm/m;  xu,max/d = ${f2(d.xr,3)};  Mu,lim = ${f2(d.Q,3)}·b·d² = ${f2(d.Mlim)} kNm/m  → ${okS(d.flex)}${d.flex?'':`  (d required ≥ ${f2(d.dReq,0)} mm — increase waist thickness)`}
Ast,req = 0.5·fck/fy·[1 − √(1 − 4.6Mu/(fck·b·d²))]·b·d = ${f2(d.Ast,0)} mm²/m;  Ast,min = ${p.fy>250?'0.12':'0.15'}% bD = ${f2(d.Amin,0)} mm²/m
Main bars: Ø${p.bar} @ ${d.s} c/c  (max ${f2(d.sMax,0)})  → Ast,prov = ${f2(d.Aprov,0)} mm²/m
Distribution: Ø${p.dbar} @ ${d.sd} c/c  (Ast = ${f2(d.Amin,0)}, max spacing ${f2(d.sdMax,0)})  → ${f2(d.Adprov,0)} mm²/m
Shear: Vu = ${f2(d.Vu)} kN/m;  τv = ${f2(d.tv,3)} MPa;  pt = ${f2(d.pt,3)}%;  τc = ${f2(d.tc,3)};  k = ${f2(d.k,2)};  k·τc = ${f2(d.k*d.tc,3)}  → ${okS(d.shear)};  τv ≤ 0.5τc,max = ${f2(d.tcmax/2,2)} → ${okS(d.shearMax)}
Deflection: fs = 0.58·fy·Ast,req/Ast,prov = ${f2(d.fs,0)} MPa;  kt = ${f2(d.kt)};  allowable l/d = 20 × kt = ${f2(d.ldAllow,1)};  actual = ${f2(d.ld,1)}  → ${okS(d.defl)}</div>
<b>Provide:</b> ${d.D} mm waist, Ø${p.bar} @ ${d.s} mm c/c main, Ø${p.dbar} @ ${d.sd} mm c/c distribution ${d.flex&&d.shear&&d.shearMax&&d.defl?'<span class="ok">— all checks OK</span>':'<span class="ng">— revise</span>'}</div>`;}
  if(!ofType('span').length)h+='<div class="info">No spans yet — draw spans or press <b>Auto spans</b>.</div>';
  h+='<h2>Flight geometry</h2><table><tr><th>Flight</th><th>Risers</th><th>R (mm)</th><th>T (mm)</th><th>2R+T</th><th>Going (m)</th><th>Rise (m)</th><th>Levels</th></tr>';
  for(const f of ofType('flight')){const F=frame(f),c=2*f.R+f.T;h+=`<tr><td>${f.name}</td><td>${f.n}</td><td>${f.R}</td><td>${f.T}</td><td>${c} ${c<550||c>700?'<span class="ng">(550–700)</span>':''}</td><td>${f2(F.L)}</td><td>${f2(F.H,3)}</td><td>${f2(f.z0,3)} → ${f2(f.z0+F.H,3)}</td></tr>`;}
  $('#viewRes').innerHTML=h+'</table>';
}
function csv(){const{out}=beamLoads(),L=['Beam,Grid,Load Pattern,Start Dist (m),End Dist (m),Load (kN/m),Span'];
  for(const[b,rows]of out)for(const r of rows){L.push(`${b.name},${gridRef(b)},Stair Dead,${f2(r.a,3)},${f2(r.b,3)},${f2(r.dl,3)},${r.sp.name}`);L.push(`${b.name},${gridRef(b)},Stair Live,${f2(r.a,3)},${f2(r.b,3)},${f2(r.ll,3)},${r.sp.name}`);}
  download('stair-beam-loads.csv',L.join('\n'),'text/csv');}
function download(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

// ---------- side panel ----------
const SCH={
  flight:[['name','Name','text'],['x','X min corner (m)'],['y','Y min corner (m)'],['dir','Up direction','sel',['+x','-x','+y','-y']],['width','Width (m)'],['n','No. of risers','int'],['R','Riser (mm)'],['T','Tread (mm)'],['t','Waist thickness (mm)'],['z0','Bottom level (m)']],
  landing:[['name','Name','text'],['x','X min corner (m)'],['y','Y min corner (m)'],['w','Size along X (m)'],['h','Size along Y (m)'],['z','Top level (m)'],['t','Thickness (mm)']],
  column:[['name','Name','text'],['x','X (m)'],['y','Y (m)'],['b','Size along X (mm)'],['D','Size along Y (mm)']],
  beam:[['name','Name','text'],['kind','Type','sel',['primary','secondary','landing','side']],['x1','X1 (m)'],['y1','Y1 (m)'],['x2','X2 (m)'],['y2','Y2 (m)'],['b','Width b (mm)'],['D','Depth D (mm)'],['z','Top level (m)']],
  grid:[['name','Label','text'],['v','Ordinate (m)']],
  span:[['name','Name','text'],['x1','X1 (m)'],['y1','Y1 (m)'],['x2','X2 (m)'],['y2','Y2 (m)'],['width','Strip width (m)']]};
const PSCH=[['fck','Concrete fck (MPa)','sel',[15,20,25,30,35,40]],['fy','Steel fy (MPa)','sel',[250,415,500,550]],['cover','Clear cover (mm)'],['bar','Main bar Ø (mm)','sel',[8,10,12,16,20]],
  ['dbar','Distribution bar Ø (mm)','sel',[8,10,12]],['ff','Floor finish (kN/m²)'],['ll','Live load (kN/m²)'],['gc','Concrete unit wt (kN/m³)'],['gf','Load factor γf'],
  ['T','Default tread (mm)'],['R','Default riser (mm)'],['width','Default flight width (m)'],['t','Default waist (mm)'],['tl','Default landing t (mm)'],['snap','Snap step (m)']];
function form(host,sch,obj,onSet){host.innerHTML='';host.className='form';
  for(const[k,lab,ty,opts]of sch){const l=document.createElement('label');l.textContent=lab;l.htmlFor='f_'+k;const el=document.createElement(ty==='sel'?'select':'input');el.id='f_'+k;
    if(ty==='sel')el.innerHTML=opts.map(o=>`<option ${o==obj[k]?'selected':''}>${o}</option>`).join('');else{el.type=ty==='text'?'text':'number';el.step='any';el.value=obj[k];}
    el.addEventListener('change',()=>{const str=ty==='text'||k==='dir'||k==='kind',v=str?el.value:+el.value;if(!str&&!Number.isFinite(v))return;commit();onSet(k,ty==='int'?Math.max(2,Math.round(v)):v);refresh(true);});
    host.append(l,el);}}
function panel(){
  const it=byId(sel),host=$('#props'),n=selSet().size;
  if(n>1)host.innerHTML=`<div class="info">${n} items selected: ${[...selSet()].map(i=>byId(i)?.name).join(', ')}. Drag any of them to move together, Del to delete, Shift+click to add/remove.</div>`;
  else if(!it)host.innerHTML='<div class="info">Nothing selected. Pick a tool on the left and draw on the plan, or load a template.</div>';
  else{form(host,SCH[it.type],it,(k,v)=>{it[k]=v;if(it.type==='span')it.auto=false;});const d=document.createElement('div');d.className='info';d.style.gridColumn='1/-1';
    if(it.type==='flight'){const F=frame(it);d.innerHTML=`Going ${F.L.toFixed(2)} m · rise ${F.H.toFixed(3)} m · top level ${(it.z0+F.H).toFixed(3)} · slope ${(Math.atan(it.R/it.T)*180/Math.PI).toFixed(1)}° · 2R+T = ${2*it.R+it.T}`;}
    if(it.type==='span'){const A=analyze(it);if(A)d.innerHTML=`Span ${A.L.toFixed(3)} m · supports ${A.sup.map(s=>s.beam?s.beam.name:'—').join(' → ')} · Mu ${A.U.M.toFixed(2)} kNm/m`+(it.auto?' · auto (regenerated by Auto spans; editing makes it manual)':'');}
    if(it.type==='grid')gridExtras(host,it);
    if(it.type==='beam'&&it.kind==='side')d.innerHTML=sideFlight(it)?`Side beam follows the adjacent flight: ${beamTop(it).map(([s,z])=>`${s.toFixed(2)} m @ +${z.toFixed(3)}`).join(' → ')}`:'Side beam: no parallel flight beside it yet — flat at top level. Draw the flight and it will crank to suit.';
    host.append(d);}
  $('#list').innerHTML=S.items.map(i=>`<div data-id="${i.id}" class="${isSel(i.id)?'sel':''}"><span>${i.name}</span><span>${i.type}</span></div>`).join('');
}
$('#list').addEventListener('click',e=>{const d=e.target.closest('[data-id]');if(d){sel=+d.dataset.id;msel.clear();refresh(true);}});
let focusCC=false;
// c/c editing: changing it shifts this grid and every grid beyond it; "Add" places a new grid at c/c beyond this one
function gridExtras(host,it){
  const G=grids(it.axis),prev=G.filter(q=>q.v<it.v-1e-6).pop(),cc=prev?r4(it.v-prev.v):null,row=(lab,el)=>{const l=document.createElement('label');l.textContent=lab;l.htmlFor=el.id;host.append(l,el);};
  const inp=(id,v)=>{const e=document.createElement('input');e.type='number';e.step='any';e.id=id;e.value=v;return e;};
  if(prev){const e=inp('f_cc',cc);row(`c/c from grid ${prev.n} (m)`,e);
    e.addEventListener('change',()=>{const v=+e.value;if(!(v>0))return;commit();const dv=r4(v-cc);
      for(const g of ofType('grid'))if(g.axis===it.axis&&g.v>=it.v-1e-6)g.v=r4(g.v+dv);refresh(true);});}
  const nx=inp('f_next',cc||3);row('Next grid at c/c (m)',nx);
  const b=document.createElement('button');b.textContent=`+ Add grid ${nextGridName(it.axis)} at c/c`;b.style.gridColumn='1/-1';
  b.onclick=()=>{const v=+nx.value;if(!(v>0))return;commit();sel=add({type:'grid',axis:it.axis,v:r4(it.v+v),name:nextGridName(it.axis)}).id;refresh(true);};host.append(b);
  if(focusCC){focusCC=false;const f=$('#f_cc')||nx;setTimeout(()=>{f.focus();f.select();});}
}
function paramsPanel(){form($('#params'),PSCH,S.p,(k,v)=>S.p[k]=v);}

// ---------- wiring ----------
function save(){try{localStorage.setItem('stairDesigner',JSON.stringify(S));}catch(e){}}
function refresh(withPanel){readColors();save();drawPlan();if(tab==='Elev')drawElev();if(tab==='3d')build3d();if(tab==='Res')results();if(withPanel)panel();}
$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$('#hud').textContent=HINT[tool];$$('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));cP.style.cursor=tool==='select'?'default':tool==='pan'?'grab':'crosshair';});
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$$('.view').forEach(v=>v.classList.toggle('show',v.id==='view'+tab));refresh();});
$('#elevDir').onchange=()=>drawElev();
$('#wf').onchange=$('#showLoads').onchange=()=>build3d();
$('#tplSel').onchange=e=>{if(e.target.value)template(e.target.value);e.target.value='';};
$('#bNew').onclick=()=>{if(!confirm('Clear the drawing?'))return;commit();S={p:S.p,items:[],nid:1};sel=null;refresh(true);};
$('#bSave').onclick=()=>download('stair.json',JSON.stringify(S,null,1),'application/json');
$('#bOpen').onclick=()=>$('#fOpen').click();
$('#fOpen').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.items))throw 0;commit();o.nid=o.nid||o.items.length+1;migrateGrids(o);S={p:{...P0,...o.p},items:o.items,nid:o.nid};sel=null;fitPlan();if(T3)T3.fitted=false;refresh(true);}catch(_){alert('Not a valid stair file.');}e.target.value='';};
$('#bCsv').onclick=csv;
$('#bPrint').onclick=()=>{results();setTimeout(()=>print(),50);};
$('#bUndo').onclick=undo;
$('#bAuto').onclick=()=>{autoSpans();refresh(true);};
$('#bDel').onclick=()=>{const D=selSet();if(!D.size)return;commit();S.items=S.items.filter(i=>!D.has(i.id));sel=null;refresh(true);};
$('#bFit').onclick=()=>{if(tab==='3d')fit3d();else{fitPlan();drawPlan();}};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}else if(e.key==='Delete'||e.key==='Backspace')$('#bDel').click();
  else if(e.key==='Escape'){drag=null;$('[data-tool=select]').click();drawPlan();}else if(e.key==='v')$('[data-tool=select]').click();});
new ResizeObserver(()=>{drawPlan();if(tab==='Elev')drawElev();}).observe(cP);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>refresh());
$('#themeSel').value=document.documentElement.dataset.theme||'';
$('#themeSel').onchange=e=>{const t=e.target.value;if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;try{localStorage.setItem('stairTheme',t);}catch(e){}refresh();};

// self-check: uniform load w on span L -> R = wL/2, M = wL²/8
(()=>{const r=ssBeam([{a:0,b:4,w:10}],4);console.assert(Math.abs(r.RA-20)<1e-9&&Math.abs(r.M-20)<1e-6,'ssBeam UDL');
  const r2=ssBeam([{a:0,b:1,w:6}],4);console.assert(Math.abs(r2.RA-5.25)<1e-9&&Math.abs(r2.RB-0.75)<1e-9,'ssBeam partial');
  console.assert(Math.abs(tauC(0.5,25)-0.49)<1e-9&&Math.abs(kSlab(200)-1.2)<1e-9,'tables');})();

let loaded=null;try{loaded=JSON.parse(localStorage.getItem('stairDesigner'));}catch(e){}
paramsPanel();
if(loaded&&Array.isArray(loaded.items)&&loaded.items.length){migrateGrids(loaded);S={p:{...P0,...loaded.p},items:loaded.items,nid:loaded.nid};readColors();fitPlan();refresh(true);}else{readColors();template('dog');hist.length=0;}
</script>
</body>
</html>
